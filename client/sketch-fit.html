<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>토끼 스케치 윤곽 보정 · Aurora</title><link rel="stylesheet" href="./styles.css"><style>.fit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.fit-grid img{width:100%;max-width:320px;image-rendering:auto;background:#f5f7fa}.fit-viewer{height:320px;width:100%}label{display:block;margin:12px 0}input{max-width:100%}.workspace{max-width:1150px;margin:auto}button{margin:8px 8px 8px 0}#fit-confirm{width:auto;display:inline-block;margin-right:8px}</style><script type="module" src="./js/sketch-fit-view.js"></script></head><body><main class="workspace"><p><a href="./index.html#/labeling">← 디지털 샘플링으로</a></p><h1>토끼 스케치 → 정면 윤곽 보정</h1><p>규칙 기하 후보의 귀·머리·몸통 비율을 조절합니다. 논문 모델 재현·학습형 3D 생성·봉제 검증이 아닙니다.</p><section class="panel"><form id="fit-form"><label>정면 스케치 PNG/JPEG · 최대 2MiB<input id="fit-file" type="file" accept="image/png,image/jpeg" required></label><p>밝은 배경·어두운 닫힌 외곽선을 사용하세요. 글씨·배경·분리된 부위는 오분할될 수 있습니다. 사선·측면은 미지원입니다.</p><div class="fit-grid"><label>목표 너비 mm<input id="fit-width" type="number" min="10" max="2000" value="180" required></label><label>목표 높이 mm<input id="fit-height" type="number" min="10" max="2000" value="300" required></label><label>가정 깊이 mm · 스케치에서 복원하지 않음<input id="fit-depth" type="number" min="10" max="2000" value="120" required></label></div><label><input id="fit-confirm" type="checkbox" required>정면 토끼이며 입력 이미지를 로컬 서버에 저장하는 데 동의합니다.</label><button id="fit-run" type="submit" disabled>윤곽 보정 실행</button></form><p id="fit-status" role="status" aria-live="polite">로컬 서버 연결 확인 중…</p></section><section id="fit-result" class="panel" hidden><h2>정규화된 정면 실루엣</h2><p id="fit-metrics"></p><div class="fit-grid"><article><h3>추출된 목표 마스크</h3><img id="fit-target" alt="업로드에서 추출한 목표 마스크"><p>먼저 이 마스크가 의도한 외곽선인지 확인하세요.</p></article><article><h3>보정 전</h3><img id="fit-before" alt="보정 전 정면 실루엣"></article><article><h3>보정 후</h3><img id="fit-after" alt="보정 후 정면 실루엣"></article></div><div class="fit-grid"><article><h3>보정 전 3D</h3><div id="fit-before-3d" class="fit-viewer"></div></article><article><h3>보정 후 3D</h3><div id="fit-after-3d" class="fit-viewer"></div></article></div><p id="fit-view-status" role="status"></p><div id="fit-downloads"></div><h3>검증 경계</h3><ul id="fit-warnings"></ul><details><summary>파라미터·재현 정보</summary><pre id="fit-report"></pre></details></section></main></body></html>
