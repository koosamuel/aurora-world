[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-world"
version = "0.1.0"
description = "Synthetic demand forecasting and two-project Supabase client"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aurora = "aurora.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
data = ["Pillow>=10,<13"]
